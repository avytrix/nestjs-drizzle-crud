name: Release

# Publishes only packages/nestjs-drizzle-crud to npm when a v* tag is pushed.
# The apps (docs, api) are private and never published.
#
# npm trusted publishing (OIDC): no token. npm trusts this workflow file in
# avytrix/nestjs-drizzle-crud (npmjs.com → package → Settings → Trusted Publisher),
# so the job's GitHub identity token is exchanged for a one-off publish credential.
# Needs npm >= 11.5.1 and package.json repository.url matching this repo.
#
#   pnpm version-bump, commit, then:  git tag v3.2.2 && git push origin v3.2.2
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish @avytrix/nestjs-drizzle-crud
    runs-on: ubuntu-latest
    # npm's trusted publisher requires this environment; GitHub only allows it from
    # v* tags and holds the job until a maintainer approves the deployment.
    environment: github-drizzle-crud
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # No registry-url: it writes an _authToken placeholder that would shadow OIDC
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate the release on the same checks as local "done".
      - run: pnpm lint
      - run: pnpm --filter @avytrix/nestjs-drizzle-crud typecheck
      - run: pnpm --filter @avytrix/nestjs-drizzle-crud build
      - run: pnpm --filter @avytrix/nestjs-drizzle-crud test
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm 11, this pins the floor
      - run: npm install -g npm@^11.5.1 && npm --version
      # npm (not pnpm) publishes: it performs the OIDC exchange. The package has no workspace: deps.
      - run: npm publish --provenance --access public
        working-directory: packages/nestjs-drizzle-crud
