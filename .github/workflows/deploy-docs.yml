name: Docs

# Builds apps/docs exactly the way avytrix.dev's CI does and runs the SEO gate over the export.
# Nothing is deployed from this repo: avytrix.dev checks out main, runs these same commands and
# copies apps/docs/out into its own site at https://avytrix.dev/opensource/nestjs-drizzle-crud/.
# A red run here means the next avytrix.dev deploy would fail on the docs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs build and SEO gate
    runs-on: ubuntu-latest
    env:
      # The origin only, and the path prefix; the same values avytrix.dev passes.
      NEXT_PUBLIC_SITE_URL: https://avytrix.dev
      NEXT_PUBLIC_BASE_PATH: /opensource/nestjs-drizzle-crud
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: page "last updated" dates, the sitemap lastmod and the docs
          # changelog are read from git at build time.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.[jt]s', 'apps/docs/**/*.[jt]sx', 'apps/docs/content/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Build docs (static export)
        # turbo builds the library first (docs depends on its types via twoslash).
        run: pnpm turbo run build --filter=nestjs-drizzle-crud-docs
      - name: SEO gate
        # Fails on any SEO/AEO regression and on any site path outside the basePath
        # (apps/docs/scripts/seo_check.py).
        run: python3 apps/docs/scripts/seo_check.py apps/docs/out
