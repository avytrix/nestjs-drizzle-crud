name: Deploy Docs

# Builds apps/docs as a static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: page "last updated" dates, the sitemap lastmod and the docs
          # changelog are read from git at build time.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Restore Next.js cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.[jt]s', 'apps/docs/**/*.[jt]sx', 'apps/docs/content/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Build docs (static export)
        # turbo builds the library first (docs depends on its types via twoslash).
        # Custom domain (CNAME) serves at root, so no basePath.
        run: |
          export NEXT_PUBLIC_SITE_URL="https://$(cat CNAME)"
          pnpm turbo run build --filter=nestjs-drizzle-crud-docs
      - name: SEO gate
        # Fails the deploy on any SEO/AEO regression (apps/docs/scripts/seo_check.py).
        run: |
          export NEXT_PUBLIC_SITE_URL="https://$(cat CNAME)"
          python3 apps/docs/scripts/seo_check.py apps/docs/out
      - name: Preserve custom domain + disable Jekyll
        run: |
          cp CNAME apps/docs/out/CNAME
          touch apps/docs/out/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0 (pins upload-artifact by SHA, required by the repo)
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
