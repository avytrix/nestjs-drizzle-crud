packages:
  - "apps/*"
  - "packages/*"

# Supply-chain settings. A new version is only resolvable after it has been
# public for seven days (10080 minutes), transitive dependencies cannot come
# from non-registry sources, and a package cannot downgrade these settings.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

# The quarantine is a supply-chain control, not a reason to sit on a known
# vulnerability. These are excluded because the version we need is the security
# patch itself, published inside the window. Remove an entry once its fix has
# aged past seven days.
minimumReleaseAgeExclude:
  - next # 16.2.12 patches the middleware bypass, App Router DoS and two SSRFs
  - "@next/*" # the swc binaries are versioned in lockstep with next
  - postcss # 8.5.23 patches GHSA-fxqj-rqcc-2cmp

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver

# Force patched versions of advisory-flagged transitive dependencies. The
# published package has no runtime dependencies of its own, so every entry here
# belongs to the apps or the toolchain. `pnpm audit` reports nothing at any
# severity with these in place; drop an entry once the parent ships the fix.
overrides:
  postcss: ">=8.5.23" # GHSA-qx2v-qp2m-jg93, GHSA-fxqj-rqcc-2cmp, via next
  nanoid: ">=3.3.17" # GHSA-2v37-7h3g-55p8, via next > postcss
  sharp: ">=0.35.5" # libvips advisories, via next
  multer: ">=2.5.0" # GHSA on <2.5.0, via @nestjs/platform-express in apps/api (its latest ships 2.5.0)
  # Dev tree only, so these never reached `audit --prod`, but Dependabot's
  # security updates kept failing to patch them through the lockfile. Both are
  # single-function modules with a stable API, and the whole verify set passes
  # with the resolved versions.
  brace-expansion: ">=2.1.4" # GHSA on <1.1.18 and <2.1.4, via minimatch
  js-yaml: ">=3.15.1" # GHSA on <3.15.1, via the jest toolchain
